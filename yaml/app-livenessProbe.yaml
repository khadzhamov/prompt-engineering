apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-demo-app-liveness
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: go-demo-app-liveness
  template:
    metadata:
      labels:
        app: go-demo-app-liveness
    spec:
      containers:
        - name: go-demo-app
          image: ghcr.io/den-vasyliev/go-demo-app:latest
          ports:
            - name: http
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
