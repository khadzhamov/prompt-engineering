apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-demo-app-volume
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: go-demo-app-volume
  template:
    metadata:
      labels:
        app: go-demo-app-volume
    spec:
      containers:
        - name: go-demo-app
          image: ghcr.io/den-vasyliev/go-demo-app:latest
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: app-data
              mountPath: /var/lib/go-demo-app/data
      volumes:
        - name: app-data
          emptyDir: {}
