apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-demo-app-resources
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: go-demo-app-resources
  template:
    metadata:
      labels:
        app: go-demo-app-resources
    spec:
      containers:
        - name: go-demo-app
          image: ghcr.io/den-vasyliev/go-demo-app:latest
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
