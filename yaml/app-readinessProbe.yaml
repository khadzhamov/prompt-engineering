apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-demo-app-readiness
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: go-demo-app-readiness
  template:
    metadata:
      labels:
        app: go-demo-app-readiness
    spec:
      containers:
        - name: go-demo-app
          image: ghcr.io/den-vasyliev/go-demo-app:latest
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
