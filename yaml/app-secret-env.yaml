apiVersion: v1
kind: Secret
metadata:
  name: go-demo-db-credentials
  namespace: default
type: Opaque
stringData:
  # Replace these placeholders. Do not commit real credentials.
  DB_USERNAME: CHANGE_ME_USERNAME
  DB_PASSWORD: CHANGE_ME_PASSWORD
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-demo-app-secret
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: go-demo-app-secret
  template:
    metadata:
      labels:
        app: go-demo-app-secret
    spec:
      containers:
        - name: go-demo-app
          image: ghcr.io/den-vasyliev/go-demo-app:latest
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: go-demo-db-credentials
                  key: DB_USERNAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: go-demo-db-credentials
                  key: DB_PASSWORD
