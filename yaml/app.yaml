apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-demo-app
  namespace: default
  labels:
    app.kubernetes.io/name: go-demo-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: go-demo-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: go-demo-app
    spec:
      containers:
        - name: go-demo-app
          image: ghcr.io/den-vasyliev/go-demo-app:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: go-demo-app
  namespace: default
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: go-demo-app
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
